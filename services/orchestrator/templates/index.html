<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OpenCode-like MVP</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 860px; }
    textarea, input { width: 100%; margin-top: 0.3rem; }
    .panel { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    button { margin-top: 0.5rem; }
    pre { background:#f7f7f7; padding:0.8rem; overflow:auto; }
  </style>
</head>
<body>
  <h1>OpenCode-like MVP</h1>
  <div class="panel">
    <h3>1) Plan</h3>
    <input id="goal" value="Update hello.txt with better greeting" />
    <button onclick="createPlan()">Create Plan</button>
    <pre id="planOut"></pre>
  </div>

  <div class="panel">
    <h3>2) Apply Patch Tool Call</h3>
    <label>Relative path</label><input id="relPath" value="hello.txt" />
    <label>Before</label><textarea id="before" rows="3">Hello</textarea>
    <label>After</label><textarea id="after" rows="3">Hello from OpenCode-like MVP</textarea>
    <button onclick="previewPatch()">Preview Action</button>
    <button onclick="approveAndRun()">Approve + Execute</button>
    <pre id="toolOut"></pre>
  </div>

<script>
async function createPlan() {
  const goal = document.getElementById('goal').value;
  const res = await fetch('/api/plan', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({goal})});
  document.getElementById('planOut').textContent = JSON.stringify(await res.json(), null, 2);
}

async function previewPatch() {
  const payload = {
    tool_name: 'workspace.apply_patch',
    approved: false,
    args: {
      rel_path: document.getElementById('relPath').value,
      before: document.getElementById('before').value,
      after: document.getElementById('after').value
    }
  };
  const res = await fetch('/api/execute', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  document.getElementById('toolOut').textContent = JSON.stringify(await res.json(), null, 2);
}

async function approveAndRun() {
  const payload = {
    tool_name: 'workspace.apply_patch',
    approved: true,
    args: {
      rel_path: document.getElementById('relPath').value,
      before: document.getElementById('before').value,
      after: document.getElementById('after').value
    }
  };
  const res = await fetch('/api/execute', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  document.getElementById('toolOut').textContent = JSON.stringify(await res.json(), null, 2);
}
</script>
</body>
</html>
